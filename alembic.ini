[alembic]
script_location = src/luplo/_db_assets
version_locations = src/luplo/_db_assets/migrations
path_separator = os
# sqlalchemy.url is intentionally left blank — env.py reads ``LUPLO_DB_URL``
# when no URL is set on the alembic Config. Production callers should prefer
# ``lp migrate``, which constructs an alembic Config programmatically from the
# wheel-bundled assets and sets the URL explicitly. This .ini exists for dev
# convenience (``LUPLO_DB_URL=… alembic upgrade head`` from the repo root) and
# for ``alembic revision``.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
