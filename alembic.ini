[alembic]
script_location = src/luplo/_db_assets
version_locations = src/luplo/_db_assets/migrations
path_separator = os
# Overridden at runtime by LUPLO_DB_URL env var (see env.py).
# This fallback has no credentials — set LUPLO_DB_URL for real use.
# Production callers should prefer `lp migrate`, which constructs an
# alembic Config programmatically from the wheel-bundled assets and
# does not require this file. This .ini exists for dev convenience
# (`alembic upgrade head` from the repo root) and for `alembic revision`.
sqlalchemy.url = postgresql+psycopg://localhost/luplo

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
